name: Pipeline
on:
  push:
  pull_request:
  schedule:
    - cron: "0 10 * * 1"   # weekly run, Mondays
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run pipeline end to end (extract, load, dbt build, report)
        run: python run_pipeline.py
      - name: End-to-end tests
        run: pytest -q
      - name: Publish report
        run: cat reports/pipeline_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: |
            reports/pipeline_report.md
            docs/*.png
