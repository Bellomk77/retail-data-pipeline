version: 2
models:
  - name: fct_orders
    description: One row per order with gross sales, returns and net revenue (CAD). Incremental with a 3-day lookback.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        description: Null for guest checkouts.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: net_revenue
        data_tests: [not_null]
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ["VIP", "Repeat", "One-time", "Prospect"]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: mart_cohort_retention
    columns:
      - name: retention_rate
        data_tests: [not_null]
